<svg width="640" height="400" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif">
  <defs>
    <!-- Blurry filter to simulate unclear upload for needs_update scenario -->
    <filter id="slightBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" />
    </filter>
    <linearGradient id="glareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cardGradAnisa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2EEF8" />
      <stop offset="50%" stop-color="#D5E6F5" />
      <stop offset="100%" stop-color="#C2DCF2" />
    </linearGradient>
  </defs>

  <!-- Slight angle/crop container with blur -->
  <g filter="url(#slightBlur)" transform="rotate(-1.5 320 200)">
    <!-- Card Frame -->
    <rect x="25" y="15" width="590" height="370" rx="16" fill="url(#cardGradAnisa)" stroke="#94A3B8" stroke-width="2"/>

    <!-- Header -->
    <text x="320" y="48" font-size="15" font-weight="800" fill="#1E3A5F" text-anchor="middle" letter-spacing="2">REPUBLIK INDONESIA [DEMO]</text>
    <text x="320" y="68" font-size="13" font-weight="700" fill="#2D4A6F" text-anchor="middle" letter-spacing="1.5">PROVINSI JAWA BARAT - KOTA BANDUNG</text>

    <!-- NIK (Slightly blurry) -->
    <text x="50" y="105" font-size="17" font-weight="800" fill="#0F243E">NIK</text>
    <text x="180" y="105" font-size="17" font-weight="800" fill="#0F243E">: 3273014508930004</text>

    <!-- Details -->
    <g font-size="11" font-weight="700" fill="#1E3A5F">
      <text x="50" y="135">Nama</text>
      <text x="180" y="135">: ANISA KUSUMA DEWI</text>

      <text x="50" y="158">Tempat/Tgl Lahir</text>
      <text x="180" y="158">: BANDUNG, 05-08-1993</text>

      <text x="50" y="180">Jenis Kelamin</text>
      <text x="180" y="180">: PEREMPUAN</text>

      <text x="50" y="202">Alamat</text>
      <text x="180" y="202">: JL. DAGO ELOS NO. 88</text>

      <text x="70" y="222">RT/RW</text>
      <text x="180" y="222">: 002/007</text>

      <text x="70" y="242">Kel/Desa</text>
      <text x="180" y="242">: DAGO</text>

      <text x="70" y="262">Kecamatan</text>
      <text x="180" y="262">: COBLONG</text>

      <text x="50" y="285">Agama</text>
      <text x="180" y="285">: ISLAM</text>

      <text x="50" y="307">Status Perkawinan</text>
      <text x="180" y="307">: KAWIN</text>

      <text x="50" y="329">Pekerjaan</text>
      <text x="180" y="329">: DESAINER GRAFIS</text>
    </g>

    <!-- Photo Box with glare -->
    <g transform="translate(455, 110)">
      <rect x="0" y="0" width="130" height="170" rx="8" fill="#DC2626" stroke="#991B1B" stroke-width="2"/>
      <circle cx="65" cy="65" r="30" fill="#FEE2E2" />
      <path d="M 25 150 C 25 105, 105 105, 105 150 Z" fill="#FEE2E2" />
    </g>
  </g>

  <!-- Glare Overlay on top to test reflection/blur issues -->
  <polygon points="120,10 400,10 250,390 0,390" fill="url(#glareGrad)" pointer-events="none" />

  <!-- Prominent Watermark (Sharp on top) -->
  <g transform="translate(320, 200) rotate(-20)">
    <rect x="-240" y="-28" width="480" height="56" rx="10" fill="#EF4444" fill-opacity="0.22" stroke="#DC2626" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="0" y="10" font-size="26" font-weight="900" fill="#B91C1C" text-anchor="middle" letter-spacing="3" opacity="0.9">DATA FIKTIF - SIMULASI BURAM/SILAU</text>
  </g>
</svg>
